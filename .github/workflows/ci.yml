name: Linting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Rust changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          # New refs have an all-zero before SHA; validate conservatively.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            changed=true
          else
            set +e
            git diff --quiet "$base" "$head" -- \
              src/ crates/ tests/ Cargo.toml Cargo.lock \
              rust-toolchain.toml build.rs .cargo/
            result=$?
            set -e
            case "$result" in
              0) changed=false ;;
              1) changed=true ;;
              *) echo "::error::Unable to compare commits"; exit "$result" ;;
            esac
          fi
          echo "rust_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Rust lint required: **$changed**" >> "$GITHUB_STEP_SUMMARY"

      - name: Check patch whitespace
        shell: bash
        run: |
          git diff --check HEAD^ HEAD 2>/dev/null || \
            git diff --check

      - name: Install Rust
        if: steps.changes.outputs.rust_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        if: steps.changes.outputs.rust_changed == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install Linux libraries
        if: steps.changes.outputs.rust_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Format
        if: steps.changes.outputs.rust_changed == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.changes.outputs.rust_changed == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: No Rust changes
        if: steps.changes.outputs.rust_changed == 'false'
        run: echo "No Rust source, manifest, or toolchain changes; Rust checks not needed." >> "$GITHUB_STEP_SUMMARY"
