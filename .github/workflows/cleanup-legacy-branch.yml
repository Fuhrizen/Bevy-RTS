# One-time repository maintenance, removed after its first run.
name: Prune superseded branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    if: github.event.head_commit.message == 'chore: prune superseded gameplay branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove former combined feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/bevy-starter-ci-releases"
