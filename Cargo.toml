[package]
name = "brevy-rts"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Bevy-powered real-time strategy game"

[workspace]
members = ["crates/brevy-core"]
resolver = "3"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "2d_bevy_render",
    "ui_bevy_render",
    "bevy_audio",
    "wav",
    "ui_picking",
    "bevy_ui_widgets",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Canary is an expendable preview build: faster to compile than the fully
# optimised, distributable stable release profile.
[profile.canary]
inherits = "release"
opt-level = 1
codegen-units = 32
lto = false
strip = "debuginfo"
